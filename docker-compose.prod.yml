# Продакшн — на сервере в /home/bitrix/aiconnect/ (docs/DEPLOY.md, схема эталона client-bank-alfa-by).
# Требует на хосте:
#   - docker-сеть proxy-net и общий nginx-proxy + acme-companion (TLS Let's Encrypt) — ставятся
#     один раз на сервер (currency-converter/docker-compose.nginxproxy.yml);
#   - Watchtower, запущенный с --label-enable, — один на сервер: подхватит контейнер по метке ниже.
#     Свой Watchtower здесь НЕ поднимаем: второй экземпляр конфликтует по container_name и
#     плодит двойные перезапуски.
#   - .env рядом с этим файлом (шаблон — раздел «Прод» в .env.example).
#
# Один контейнер: Nitro отдаёт страницы приложения и /api на :3000. Наружу его выставляет
# nginx-proxy по VIRTUAL_HOST — отдельного порта на хосте нет.

# Ротация логов: без неё docker пишет json-file без предела и со временем забивает диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  app:
    logging: *default-logging
    image: ghcr.io/bx-shef/aiconnect:latest
    container_name: aiconnect
    expose:
      - "3000"
    # Всё окружение приложения — из .env целиком: новая переменная сервера доедет до контейнера без
    # правки этого файла. Ниже — только то, что compose задаёт сам или требует обязательно
    # (environment главнее env_file).
    env_file: .env
    environment:
      # nginx-proxy + acme-companion: по этим переменным прокси найдёт контейнер и выпустит TLS.
      # ⚠ DNS A-запись DOMAIN должна указывать на сервер ДО подъёма, иначе сертификат не выпустится.
      VIRTUAL_HOST: ${DOMAIN:?set DOMAIN (aiconnect.bx-shef.by)}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # Из адреса строятся обработчики встройки (/invoice) и событий (/api/b24/events).
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
      # Приложение за nginx-proxy: адрес клиента берём из X-Forwarded-For (прокси его дописывает),
      # иначе все запросы выглядят пришедшими с адреса прокси и лимиты по IP становятся общими.
      # Заголовку сервер верит только от соединений из частной сети — proxy-net такая.
      TRUST_PROXY: "1"
      # Шифрование токенов установки. Обязателен: без него установка падает с 500.
      # ⚠ Копия ключа — вне сервера: потеря или смена делает сохранённые токены нечитаемыми.
      # Остальное (ключи и код приложения из Маркета, BitrixGPT) — из .env; что не задано, показывают
      # главная страница приложения администратору и GET /api/health.
      B24_TOKEN_ENC_KEY: ${B24_TOKEN_ENC_KEY:?set B24_TOKEN_ENC_KEY (openssl rand -hex 32)}
    volumes:
      # Токены установки порталов (fs-хранилище Nitro). Без тома пересоздание контейнера — а
      # Watchtower пересоздаёт его на каждом выкате — их потеряет, и запись ставок
      # не-администраторами перестанет работать до переустановки приложения.
      - portals:/app/.data
    restart: unless-stopped
    # Nitro на SIGTERM перестаёт принимать запросы и ждёт начатые до 30 с (NITRO_SHUTDOWN_TIMEOUT);
    # по умолчанию Docker убил бы процесс через 10 с посреди ответа BitrixGPT. ⚠ Watchtower
    # останавливает контейнер со своим --stop-timeout (по умолчанию 10 с) — это настройка хоста.
    stop_grace_period: 40s
    healthcheck:
      # В node:22-slim нет wget и curl — проверяем самим node. 127.0.0.1, а не localhost:
      # localhost в контейнере резолвится и в ::1.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy-net
    labels:
      # Подхватит общий Watchtower хоста (запущен с --label-enable).
      - "com.centurylinklabs.watchtower.enable=true"
      # nginx-proxy по умолчанию держит соединения с приложением открытыми (keepalive, до 60 с), а Node
      # закрывает простаивающие через 5 с. Запрос в закрытое соединение — 502, и POST nginx не
      # повторяет, а Битрикс24 открывает страницы приложения именно POST-ом (замер 2026-09-25: 502 на
      # /app сразу после установки). Без keepalive каждый запрос идёт новым соединением — гонки нет.
      - "com.github.nginx-proxy.nginx-proxy.keepalive=disabled"

volumes:
  portals:

networks:
  proxy-net:
    external: true
