# Локальный или серверный запуск одним контейнером. Переменные — в .env (шаблон .env.example).
services:
  app:
    build: .
    env_file: .env
    ports:
      # Только локально: HTTPS и доступ снаружи даёт обратный прокси на этом же сервере
      # (docs/DEPLOY.md). Порт, открытый наружу мимо прокси, позволил бы обойти лимиты по IP.
      # Прокси на другой машине — замените на "3000:3000" и закройте порт сетевым экраном.
      - "127.0.0.1:3000:3000"
    volumes:
      # Токены установки порталов живут здесь; без тома переустановка контейнера их потеряет,
      # и запись ставок не-администраторами перестанет работать до переустановки приложения.
      - portals:/app/.data
    restart: unless-stopped

volumes:
  portals:
