# Local or server run as a single container. Variables — in .env (template .env.example).
services:
  app:
    build: .
    env_file: .env
    ports:
      # Local only: HTTPS and outside access are provided by a reverse proxy on this same server
      # (docs/DEPLOY.md). A port exposed outside the proxy would let someone bypass the IP limits.
      # Proxy on another machine — replace with "3000:3000" and close the port with a firewall.
      - "127.0.0.1:3000:3000"
    volumes:
      # Portal install tokens live here; without the volume, recreating the container loses them,
      # and non-admin bid submission stops working until the app is reinstalled.
      - portals:/app/.data
    restart: unless-stopped

volumes:
  portals:
