version: 2
updates:
  # --- App dependencies (pnpm) ---------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # The framework and its modules move together — one PR.
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
      # The whole Bitrix24 lineup — one PR.
      b24:
        patterns:
          - "@bitrix24/*"
      dev-deps:
        dependency-type: development

  # --- GitHub Actions versions ------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"

  # --- Docker base image -------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns:
          - "*"
    # Node 25+ removed corepack from the official images (`corepack enable` → exit 127).
    # We stay on the 22 LTS line; we bump the major version by hand along with fixing corepack.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
