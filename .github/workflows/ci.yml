name: CI

# PR   → ci (lint → tests → typecheck → build) + docker-build (image builds, doesn't push to the registry).
# main → ci → deploy (image to GHCR; Watchtower on the server picks it up in ~5 minutes).
# Scheme — same as the client-bank-alfa-by reference app (docs/DEPLOY.md).
#
# The job names `ci` and `docker-build` are required checks in the `main` branch protection rule
# (docs/REPO_SETUP_CHECKLIST.md): rename a job or it stops reporting on PRs — the rule
# will wait for it forever, and no PR will merge. Rename it only together with the rule.
#
# Third-party actions are pinned by full SHA (supply-chain: a mutable tag can be rewritten to
# run code on the runner with GITHUB_TOKEN). Dependabot reads the `# vX.Y.Z` comment and keeps
# the SHAs current. The SHAs were taken from the client-bank-alfa-by reference app, where they already pass this CI.
on:
  push:
    branches: [main]
    # Editing only these files doesn't change the image. Without the filter every docs merge would rebuild
    # the image (the new digest has different timestamps), and Watchtower would restart prod. PR checks
    # always run; to deploy manually — workflow_dispatch.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'tests/**'
      - 'smoke/**'
      - '.env*.example'
      - 'Makefile'
      - 'docker-compose*.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
  # Manual redeploy: the same pipeline on `main` without a commit (the image is rebuilt and pushed to GHCR).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # We only cancel stale PR runs; we don't abort a `main` deploy in the middle of pushing to GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # The pnpm version is taken from the "packageManager" field in package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        # Generates .nuxt/eslint.config.mjs and tsconfig, which lint and typecheck depend on.
        run: pnpm exec nuxi prepare

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker-build:
    name: docker-build
    # The image is built on every PR (including from Dependabot — that's where a node base
    # image change would surface); we don't publish to the registry.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          # Read-only cache: one written from refs/pull/N/merge is visible only to this PR but eats the shared
          # repo cache budget (10 GB) and evicts the `main` cache. Only deploy writes it.
          cache-from: type=gha,scope=app
          tags: aiconnect:ci

  deploy:
    name: Build & Push to GHCR
    # A red CI blocks the image from reaching GHCR, and so the server. Only `main` deploys —
    # via a push or a manual run (workflow_dispatch).
    needs: ci
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write  # pushing to ghcr.io with the built-in GITHUB_TOKEN, no separate secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest — pulled by Watchtower; sha-<commit> — for rolling back to a known version.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # The only build-arg is the build commit: shown by GET /api/health so the server
      # reveals which image is running and whether Watchtower rolled out the new one. The image reads
      # the address and secrets from the environment at startup (Dockerfile), so one image works for any server.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
